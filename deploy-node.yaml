---
- name: Install Node and npm
  hosts: 142.93.148.232
  tasks:
    - name: Update apt repo cache
      apt:
        update_cache: yes 
        force_apt_get: yes 
        cache_valid_time: 3600

    - name: Install Node.js and npm
      apt:
        pkg: 
          - nodejs
          - npm

- name: Create new linux user for node app
  hosts: 142.93.148.232
  vars_files:
    - project-vars
  tasks:
    - name: Create linux user
      user:
        name: "{{linux_name}}"
        comment: Node User
        group: admin

- name: Deploy nodejs app
  hosts: 142.93.148.232
  become: True
  become_user: "{{linux_name}}"
  vars_files:
    project-vars 
  tasks:
    - name: unpack nodejs app files
      unarchive:
        src: "{{location}}/nodejs-app-{{version}}.tgz"
        dest: "{{user_home_dir}}"
    - name: install dependencies
      npm: 
        path: "{{user_home_dir}}/package"
    - name: start the application
      command:
        chdir: "{{user_home_dir}}/package/app"
        cmd: node server
      async: 1000 # Run the command asynchronously
      poll: 0  # Don't wait for the command to finish
    - name: Ensure app is running
      shell: ps aux | grep node
      register: app_status
    - debug: msg={{app_status.stdout_lines}}
